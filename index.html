.dch .ch,.dfil .ch,.dsr .ch,.pane>.chs .ch,.pane.hm:not(.ob3) .dgrid .dch .ch{display:inline-flex;align-items:center;height:auto!important;padding:var(--sp-6) var(--sp-12)!important;border:0!important;border-radius:99px;background:var(--kbffffff,#fff)!important;color:var(--t,var(--mute))!important;font-size:calc(12.5px*var(--fs,1))!important;font-weight:700!important;letter-spacing:0!important;line-height:1.2!important;box-shadow:0 1px 2px rgba(20,20,40,.05),0 6px 16px -10px rgba(20,20,40,.25)!important}
.dch .ch:hover,.dfil .ch:hover,.dsr .ch:hover,.pane>.chs .ch:hover{background:var(--kbffffff,#fff)!important;box-shadow:0 1px 2px rgba(20,20,40,.07),0 10px 20px -10px rgba(20,20,40,.32)!important;filter:none!important}
.dch .ch.on,.dfil .ch.on,.dsr .ch.on,.pane>.chs .ch.on,.pane.hm:not(.ob3) .dgrid .dch .ch.on{background:var(--t,var(--ink))!important;color:#fff!important}
.dch .ch b,.dfil .ch b,.dsr .ch b,.pane>.chs .ch b{display:inline!important;margin:0 0 0 var(--sp-6)!important;font-weight:600!important;opacity:.5!important}
.dch .ch.on b,.dfil .ch.on b,.dsr .ch.on b,.pane>.chs .ch.on b{opacity:.75!important}
.chs{gap:var(--sp-6)!important}}

async function fetchAll(t){const out=[];for(let f=0;;f+=1000){const{data,error}=await sb.from(t).select('*').range(f,f+999);if(error)return{error};out.push(...data);if(data.length<1000)break}return{rows:out}}

function cleanContractRef(s, dateOnly) {
  // "CONT NO.YRL 1109 - 01.10.2026" -> "YRL 1109". Drops a leading label (Cont No, PO No, Order No, Ref...) and a trailing date.
  let t = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const MON = /^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i, SEP = /([-–—,;:(]|\b(?:dated?|dt)\b\.?:?)\s*$/i;
  const tails = [
    [/^(.*?)(\s*[-–—,;:(]\s*|\s+)(?:(?:dated?|dt)\b\.?\s*:?\s*)?\(?\s*(\d{1,2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{4}|\d{2})\s*\)?$/i, m => +m[3] <= 31 && +m[4] <= 12],
    [/^(.*?)(\s*[-–—,;:(]\s*|\s+)(?:(?:dated?|dt)\b\.?\s*:?\s*)?\(?\s*(\d{1,2})(?:st|nd|rd|th)?[\s.-]+([A-Za-z]{3,9})[\s.,-]+(\d{4}|\d{2})\s*\)?$/i, m => +m[3] <= 31 && MON.test(m[4])],
    [/^(.*?)(\s*[-–—,;:(]\s*|\s+)\(?\s*(\d{4})-(\d{2})-(\d{2})\s*\)?$/i, m => +m[4] <= 12 && +m[5] <= 31]
  ];
  for (const [re, ok] of tails) {
    const m = t.match(re);
    if (!m || !ok(m)) continue;
    const plain = !/[-–—,;:(]/.test(m[2]) && !/dated?|dt/i.test(m[0].slice(m[1].length));
    const yr = re === tails[2][0] ? m[3] : m[5];
    if (plain && String(yr).length < 4) continue;       // a bare "27/25-26" is a contract number, not a date
    const head = m[1].replace(/[\s\-–—,;:(]+$/, '').replace(SEP, '').trim();
    if (head) { t = head; break; }
  }
  if (dateOnly) return t;
  const LAB = /^(?:(?:buyer'?s?\s+)?(?:cont(?:ract)?|p\.?\s?o\.?|purchase\s+order|order|ord|ref(?:erence)?)\b\.?\s*(?:no\b\.?|nr\b\.?|number\b|#)?\s*[.:#\-–]*\s*)+/i;
  const u = t.replace(LAB, '').trim();
  return u || t;
}

 MAIL.cloud=!(a.error||b.error);MAIL.set=a.data||null;MAIL.rows=b.data||[];MAIL.n=MAIL.rows.filter(r=>r.status=='pending').length;mailBadge();mailSecret()}
/* one fixed secret, stored in Supabase so every device shows the same one (the SQL file creates it; this is the backup) */
async function mailSecret(){if(!MAIL.cloud||(MAIL.set&&MAIL.set.secret))return;if(MAIL.set&&!('secret'in MAIL.set)){MAIL.nosec=true;return}
 try{if(!MAIL.set){const r=await sb.from('mail_settings').upsert({id:'main'});if(r.error)return}
  const a=new Uint8Array(16);crypto.getRandomValues(a);const sec=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');
  await sb.from('mail_settings').update({secret:sec}).eq('id','main').or('secret.is.null,secret.eq.');
  const g=await sb.from('mail_settings').select('secret').eq('id','main').maybeSingle();
  if(g.data&&g.data.secret){MAIL.set={...(MAIL.set||{id:'main'}),secret:g.data.secret};MAIL.nosec=false;const i=$('#msec');if(i)i.value=g.data.secret}}catch(e){}}
function mailBadge(){const b=$('#mailbd');if(b){b.textContent=MAIL.n;b.hidden=!MAIL.n}document.body.classList.toggle('mpend',!!MAIL.n)}
async function mailPoll(){if(typeof uid==='undefined'||!uid||document.hidden)return;try{const{count,error}=await sb.from('mail_inbox').select('id',{count:'exact',head:true}).eq('status','pending');if(error)return;const n=count||0,was=MAIL.n;MAIL.n=n;mailBadge();if(n>was)toast(n+(n==1?' document is':' documents are')+' waiting in Invoice mail','Open',()=>settings('mail'))}catch(e){}}
setTimeout(mailPoll,6000);setInterval(mailPoll,180000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)mailPoll()});
const mailAgo=t=>{if(!t)return'';const m=Math.round((Date.now()-Date.parse(t))/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'})};

 if(hist.length)h+=ds('Recent',hist.map(r=>`<div class="mhr"><span>${MKT[r.kind]||'Document'} ${esc(r.doc_number||'')}</span><em class="${r.status}">${r.status=='applied'?'Updated':'Dismissed'}</em></div>`).join(''));

async function mailBill(r){const d=r.data||{},cs=impContracts(d).filter(c=>c.no).map(c=>c.no),ins=(d.invoice_numbers||[]).filter(Boolean),box=$('#mpv');if(!box)return;

 const named=L.filter(v=>ins.some(n=>impNk(n)==impNk(v.invoice_number))),pick=named.length?named:L,type=r.kind=='airway_bill'?'Airway Bill':'Bill of Lading';

  ${pick.length?`<div class="impk"><span>Update these invoices</span></div>${rows}${!named.length?'<div class="impw2">The bill does not name an invoice, so please tick the right one.</div>':''}<div class="impa"><button class="btn" data-mok="${r.id}" ${d.bill_number?'':'disabled'}>Approve and update</button><button class="btn ghost" data-mcancel>Cancel</button></div>`
  :`<div class="impe">No saved invoice found for this bill. Save the invoice first (it may be waiting above), then review this bill again.</div><div class="impa"><button class="btn ghost" data-mcancel>Close</button></div>`}`);

async function mailApprove(id){const r=MAIL.rows.find(x=>x.id==id),d=r&&r.data;if(!d)return;const ids=[...document.querySelectorAll('[data-mpk]:checked')].map(e=>e.dataset.mpk);if(!ids.length)return toast('Tick at least one invoice');

(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){document.documentElement.classList.add('nosr');return}
let rec=null,btn=null;
const lang=()=>{try{return localStorage.getItem('vlang')||'en-IN'}catch(e){return'en-IN'}};
function done(){if(btn)btn.classList.remove('on');btn=null;rec=null}
function stop(){const r=rec;rec=null;if(r){try{r.stop()}catch(e){}}if(btn){btn.classList.remove('on');btn=null}}
document.addEventListener('click',e=>{
 const x=e.target.closest&&e.target.closest('[data-close],[data-save]');if(x&&rec)stop();
 const b=e.target.closest&&e.target.closest('[data-mic]');if(!b)return;
 const el=document.getElementById(b.dataset.mic);if(!el)return;
 const same=btn===b;if(rec)stop();if(same)return;
 const pre=el.value+(el.value&&!/\s$/.test(el.value)?' ':'');
 const r=new SR();r.lang=lang();r.continuous=true;r.interimResults=true;
 r.onresult=ev=>{let f='',i2='';for(let i=0;i<ev.results.length;i++){const t=ev.results[i][0].transcript;if(ev.results[i].isFinal)f+=t;else i2+=t}
  let v=(pre+f+i2).replace(/\s+/g,' ');if(el.tagName=='TEXTAREA'&&el.id=='ft')v=v.replace(/\n/g,' ');
  if(!pre&&v)v=v.charAt(0).toUpperCase()+v.slice(1);
  el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));if(typeof grow=='function')grow(el)};
 r.onerror=ev=>{if(ev.error=='not-allowed'||ev.error=='service-not-allowed')toast('Microphone is blocked. Allow microphone access for this site and try again.');else if(ev.error=='audio-capture')toast('No microphone found.');else if(ev.error=='network')toast('Voice typing needs an internet connection.')};
 r.onend=()=>{if(rec===r)done()};
 try{r.start();rec=r;btn=b;b.classList.add('on')}catch(err){done()}
});
